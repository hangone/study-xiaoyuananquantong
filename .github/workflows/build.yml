name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
          cache-python: true
          enable-cache: true
        env:
          UV_PYTHON_PREFERENCE: only-managed

      - name: Build executable
        shell: bash
        run: |
          os_name=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          arch=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          ext=""
          [[ "$os_name" == "windows" ]] && ext=".exe"
          name="XiaoyuanAnQuanTong-${os_name}-${arch}${ext}"
          uv run --python 3.12 --with-requirements requirements.txt --with pyinstaller pyinstaller --noconfirm --clean --onefile --name "$name" main.py
          echo "name=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.name }}
          path: dist/${{ env.name }}*
          if-no-files-found: error

  release:
    name: Release
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: XiaoyuanAnQuanTong-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
